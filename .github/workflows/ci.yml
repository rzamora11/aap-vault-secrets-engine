name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./aap)"
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Build plugin
        run: go build -o bin/vault-plugin-secrets-aap ./cmd/vault-plugin-secrets-aap
