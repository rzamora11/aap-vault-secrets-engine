version: 2

project_name: vault-plugin-secrets-aap

builds:
  - id: vault-plugin-secrets-aap
    main: ./cmd/vault-plugin-secrets-aap
    binary: vault-plugin-secrets-aap
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: vault-plugin-secrets-aap
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt
